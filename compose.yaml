services:
  db:
    image: retailops-postgres:17-pgaudit
    build: .
    environment:
      POSTGRES_DB: retail_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Mot de passe manquant}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${RETAIL_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro
      - ${RETAIL_BACKUPS:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_admin"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
