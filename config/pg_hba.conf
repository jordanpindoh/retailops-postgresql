# Administration locale dans le conteneur
local   all   postgres                      trust
local   all   all                           scram-sha-256

# Refuser les connexions réseau sans TLS
hostnossl all  all   0.0.0.0/0               reject
hostnossl all  all   ::/0                    reject

# Connexions TLS avec authentification SCRAM
hostssl retail_admin analyst_login 0.0.0.0/0 scram-sha-256
hostssl retail_admin analyst_login ::/0      scram-sha-256
hostssl retail_admin app_login     0.0.0.0/0 scram-sha-256
hostssl retail_admin app_login     ::/0      scram-sha-256
